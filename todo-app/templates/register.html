<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <i class="bi bi-braces-asterisk auth-header-icon"></i>
            <p class="auth-header-name">Tutuman</p>
        </div>

        <div class="auth-tabs">
            <a href="{{ url_for('login') }}" class="auth-tab ">Log In</a>
            <a href="{{ url_for('register') }}" class="auth-tab active">Create Account</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <p class="message {{ category }}">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form class="auth-form" method="POST" action="{{ url_for('register') }}">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" value="{{ email or '' }}"
                    required>
                <p class="field-error"></p>
            </div>

            <div class="field">
                <label for="display_name">Display name</label>
                <input type="text" id="display_name" name="display_name" value="{{ display_name or '' }}" required>
                <p class="field-error"></p>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" minlength="8" required>
                    <button type="button" class="toggle-password" aria-label="Show password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <p class="field-error"></p>
            </div>

            <div class="field">
                <label for="confirm_password">Confirm password</label>
                <div class="password-field">
                    <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
                    <button type="button" class="toggle-password" aria-label="Show password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <p class="field-error"></p>
            </div>

            <button type="submit">Create account </button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
