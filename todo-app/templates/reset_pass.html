<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Tutuman</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        @view-transition {
            navigation: auto;
        }
    </style>
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <i class="bi bi-braces-asterisk auth-header-icon"></i>
            <p class="auth-header-name">Tutuman</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <p class="message {{ category }}">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form class="auth-form" method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="field">
                <label for="new_password">New password</label>
                <div class="password-field">
                    <input type="password" id="new_password" name="new_password" minlength="8" required>
                    <button type="button" class="toggle-password" aria-label="Show password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <p class="field-error"></p>
            </div>

            <div class="field">
                <label for="confirm_new_password">Confirm new password</label>
                <div class="password-field">
                    <input type="password" id="confirm_new_password" name="confirm_new_password" minlength="8"
                        required>
                    <button type="button" class="toggle-password" aria-label="Show password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <p class="field-error"></p>
            </div>

            <button type="submit">Set new password</button>
        </form>

        <p class="auth-footer">
            <a href="{{ url_for('login') }}">Back to log in</a>
        </p>

    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
